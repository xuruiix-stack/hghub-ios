name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint project file
        continue-on-error: true
        run: plutil -lint HGhub.xcodeproj/project.pbxproj

      - name: Build (no signing)
        run: |
          xcodebuild -project HGhub.xcodeproj -target HGhub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR=build/out \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""

      - name: Ad-hoc sign (helps TrollStore install)
        run: |
          codesign --force --sign - --timestamp=none \
            build/out/HGhub.app || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/out/HGhub.app Payload/
          zip -r HGhub.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-ipa
          path: HGhub.ipa
          if-no-files-found: error
